<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F5F6F8">
<title>Rechenwerkstatt – schriftliches Rechnen</title>
<style>
/* ===== Tokens (siehe design-system/MASTER.md) ===== */
:root{
 --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#FAFBFC;
 --ink:#141B2D;--ink-2:#46526A;--ink-3:#667085;
 --line:#E2E6ED;--line-strong:#CBD3DF;
 --accent:#2B59C3;--accent-strong:#1F4396;--accent-soft:#EBF0FC;
 --hint:#8A4B00;--hint-soft:#FFF4DE;--hint-line:#F3C77A;--hint-ink:#4A3200;
 --ok:#15693B;--ok-soft:#E5F4EA;--err:#A8251C;--err-soft:#FCECEA;
 --margin-line:#EFA39A;--grid:#D5E1F2;--grid-ink:#26324A;--rest:#D23F1A;--rule:#344965;
 --focus:#2B59C3;--focus-bg:rgb(43 89 195 / .09);--now-bg:rgb(255 196 0 / .30);
 --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --mono:"Consolas","DejaVu Sans Mono",ui-monospace,monospace;
 --r-s:8px;--r-m:14px;--r-l:24px;
 --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
 --shadow:0 1px 2px rgb(20 27 45 / .05),0 8px 28px rgb(20 27 45 / .06);
 --t-fast:140ms;--t:220ms;--ease:cubic-bezier(.2,.7,.2,1);
 --sq:34px;
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:18px;height:18px;flex:none}

/* ===== Rahmen ===== */
.app{max-width:1200px;margin:0 auto;padding:var(--space-5) var(--space-5) var(--space-8)}

/* Obere Leiste */
.topbar{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)}
.brand{display:inline-flex;align-items:center;gap:10px;margin-right:auto;color:var(--ink);text-decoration:none;font-weight:800;letter-spacing:-.01em;border-radius:var(--r-s)}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff}
.ops{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.op{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 8px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:650;transition:background-color var(--t-fast),color var(--t-fast)}
.op:hover{background:var(--bg);color:var(--ink)}
.op-symbol{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bg);font-size:18px;font-weight:800;line-height:1}
.op[aria-current="page"]{background:var(--ink);color:#fff}
.op[aria-current="page"] .op-symbol{background:rgb(255 255 255 / .16);color:#fff}

/* Einstellungen */
.settings{position:relative}
.settings-toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;list-style:none;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:14px;font-weight:650;cursor:pointer;transition:border-color var(--t-fast),color var(--t-fast)}
.settings-toggle::-webkit-details-marker{display:none}
.settings-toggle:hover{border-color:var(--line-strong);color:var(--ink)}
.settings[open] .settings-toggle{border-color:var(--accent);color:var(--accent-strong)}
.settings-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:320px;display:grid;gap:var(--space-4);padding:var(--space-5);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow),0 24px 48px rgb(20 27 45 / .10)}
.settings-head{display:flex;align-items:center;justify-content:space-between;margin:-6px -10px -4px 0}
.settings-head h2{margin:0;font-size:15px}
.field{display:grid;gap:6px}
.field-label{font-size:13px;font-weight:700;color:var(--ink-2)}
.select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface)}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* ===== Arbeitsfläche ===== */
.workspace{display:grid;gap:var(--space-6)}
.stage{min-width:0;padding:var(--space-6);background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow)}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-5)}
.stage-title{margin:0;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

/* Aufgabe */
.expression{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.3em;margin:0 0 var(--space-6);font-size:clamp(36px,5.6vw,64px);font-weight:750;line-height:1.15;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.expression .num{white-space:nowrap}
.expression .opr{color:var(--accent);font-weight:500}
.expression .eq{color:var(--ink-3);font-weight:500;white-space:nowrap}

/* Antwort */
.answer-fields{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-3)}
.field-answer{flex:1 1 220px;max-width:340px}
.field-rest{flex:0 0 112px}
.answer{width:100%;min-height:60px;padding:0 16px;border:2px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);font-size:26px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.answer::placeholder{color:#A0A9B8;font-weight:500}
.answer:hover{border-color:#AAB6C8}
.answer:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.answer[aria-invalid="true"]{border-color:var(--err)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 18px;border:1px solid transparent;border-radius:999px;background:none;font-size:15px;font-weight:700;text-decoration:none;transition:background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast),transform var(--t-fast)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-strong)}
.btn-check{min-height:60px;padding:0 28px;border-radius:var(--r-m);font-size:17px}
.btn-soft{background:var(--accent-soft);color:var(--accent-strong)}
.btn-soft:hover:not(:disabled){background:#DCE6FA}
.btn-ghost{border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--ink)}
.btn-link{min-height:44px;padding:0 2px;border-radius:var(--r-s);color:var(--accent-strong);font-weight:650}
.btn-link:hover{text-decoration:underline;text-underline-offset:3px}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;flex:none;border:0;border-radius:50%;background:none;color:var(--ink-3);transition:background-color var(--t-fast),color var(--t-fast)}
.icon-btn:hover{background:var(--bg);color:var(--ink)}

/* Rückmeldung */
.feedback{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);max-width:640px;margin-top:var(--space-4);padding:var(--space-3) var(--space-4);border-radius:var(--r-m);font-size:15px;animation:rise var(--t) var(--ease)}
.feedback>.icon{width:22px;height:22px}
.feedback-text{flex:1 1 220px;margin:0}
.feedback-text strong{font-weight:800}
.feedback.is-correct{background:var(--ok-soft);color:var(--ok)}
.feedback.is-wrong{background:var(--err-soft);color:var(--err)}
.feedback.is-wrong .btn{background:var(--surface);border-color:#F0C3BE;color:var(--err)}
.feedback.is-wrong .btn:hover{border-color:var(--err)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== Lösung im Kästchenraster ===== */
.solution{margin-top:var(--space-6);padding-top:var(--space-5);border-top:1px dashed var(--line-strong)}
.solution-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4)}
.solution-head h2{margin:0;font-size:15px;font-weight:800;color:var(--ink-2)}
.solution-value{margin:0;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
.solution.stepping .solution-value{visibility:hidden}
.papers{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--space-5)}
.paper{min-width:0;max-width:100%;margin:0}
.paper-label{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--ink-3)}
.paper-shell{max-width:100%;padding:2px;overflow-x:auto;scrollbar-width:thin}
.paper-grid{position:relative;width:max-content;min-width:calc(var(--columns) * var(--sq));background-color:#fff;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:var(--sq) var(--sq);border-top:1px solid var(--grid);border-left:1px solid var(--grid);box-shadow:1px 1px 0 var(--grid)}
.math-row{display:grid;grid-template-columns:repeat(var(--columns),var(--sq));height:var(--sq)}
.cell{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:var(--sq);height:var(--sq);color:var(--grid-ink);font-family:var(--mono);font-size:19px;font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;transition:color var(--t),background-color var(--t)}
.cell.operator{font-size:23px;font-weight:500}
.cell.result{color:var(--ok);font-weight:900}
.cell.carry{color:var(--accent);font-size:14px;font-weight:800}
.cell.head{color:#5B7391;font-family:var(--font);font-size:13px;font-weight:800}
.cell.word{justify-content:flex-start;padding-left:3px;font-family:var(--font);font-size:16px;font-weight:650}
.cell.rest{color:var(--rest);font-weight:900}
.cell.underline{border-bottom:2px solid var(--rule)}
.cell.double{border-bottom:3px double var(--rule)}
.grid-arrow{position:absolute;left:0;top:0;z-index:3;width:calc(var(--columns) * var(--sq));height:calc(var(--rows) * var(--sq));overflow:visible;pointer-events:none;transition:opacity var(--t)}
/* Schritt-für-Schritt */
.solution.stepping .cell:not(.focus):not(.now):not(.pending){color:var(--ink-3)}
.cell.focus{background-color:var(--focus-bg)}
.cell.now{background-color:var(--now-bg)}
.cell.pending{color:transparent!important}
.grid-arrow.pending{opacity:0}

/* ===== Randspalte ===== */
.margin{display:grid;align-content:start;gap:var(--space-4);min-width:0}
.note{padding:var(--space-4) var(--space-5) var(--space-5);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.note-title-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin:-6px -12px var(--space-2) 0}
.note-title{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:800}
.note-help .note-title{color:var(--hint)}
.note-steps{border-color:#C9D7F5}
.note-steps .note-title{color:var(--accent-strong)}
.note-text{margin:0;color:var(--ink-2);font-size:15px}
.note-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-4);margin-top:var(--space-4)}
.note-fine{margin:var(--space-4) 0 0;color:var(--ink-3);font-size:13px}
.tips{display:grid;gap:var(--space-3);margin:var(--space-2) 0 0;padding:0;list-style:none}
.tip{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:var(--space-3);background:var(--hint-soft);border-radius:var(--r-s);animation:rise var(--t) var(--ease)}
.tip p{margin:0;color:var(--hint-ink);font-size:15px}
.tip-no{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--hint-line);color:var(--hint-ink);font-size:13px;font-weight:800}
.progress{height:4px;margin:var(--space-2) 0 var(--space-3);overflow:hidden;background:var(--line);border-radius:4px}
.progress span{display:block;height:100%;background:var(--accent);transition:width var(--t) var(--ease)}
.step-text{min-height:3.1em;margin:0;font-size:16px;line-height:1.55}
.stepper{display:flex;gap:var(--space-2);margin-top:var(--space-4)}
.stepper .btn-primary{flex:1}

/* ===== Ab Tablet: asymmetrisch, Bühne + Rand ===== */
@media (min-width:760px){
 .workspace{grid-template-columns:minmax(0,1fr) minmax(260px,320px);align-items:start;gap:var(--space-7)}
 .stage{padding:var(--space-7) var(--space-6) var(--space-7) var(--space-7)}
 .margin{position:sticky;top:var(--space-5);min-height:280px;padding-left:var(--space-5);border-left:2px solid var(--margin-line)}
}
@media (min-width:760px) and (max-width:1023.98px){
 .topbar{gap:var(--space-3)}
 .ops{order:3;flex-basis:100%}
 .op{flex:1;justify-content:center}
 .workspace{grid-template-columns:minmax(0,1fr) 248px;gap:var(--space-5)}
 .stage{padding:var(--space-6) var(--space-5) var(--space-6) var(--space-6)}
 .margin{padding-left:var(--space-4)}
 .note{padding:var(--space-4)}
}
@media (min-width:1100px){
 .stage{padding-left:88px}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
 body{background:#fff}.app{padding:0;max-width:none}
 .topbar,.margin,.answer-form,#regenerate{display:none!important}
 .workspace{display:block}.stage{box-shadow:none;padding:0}
 .cell.pending{color:inherit!important}.cell.focus,.cell.now{background:none}.solution.stepping .cell{color:var(--grid-ink)}.grid-arrow.pending{opacity:1}
}
</style>
<style>
/* ===== Handy-Variante (< 760 px) ===== */
@media screen and (max-width:759.98px){
/* Rechenwerkstatt – Handy-Variante (< 760 px).
   Eingebettet als @media screen and (max-width: 759.98px).
   Tokens und Komponenten: design-system/MASTER.md

   Aufbau
   1. Maße und Platzreserve für die untere Leiste (--dock)
   2. Obere Leiste: Marke, Rechenarten (4 gleich breite Felder), Einstellungen
   3. Einstellungen als Bottom-Sheet (abgedunkelter Hintergrund = Summary-Pseudo-Element,
      ein Tipp darauf schließt das <details> ohne JavaScript)
   4. Bühne: große Aufgabe
   5. Antwortleiste unten im Daumenbereich (Rückmeldung direkt darüber)
   6. Lösungsraster (--sq 29 px, Rechnung und Kontrolle untereinander)
   7. Randspalte: Heftrand-Linie links; im Schrittmodus wird die Schritt-Karte
      zum kompakten Sheet unten, das Raster bleibt darüber sichtbar
   8. Querformat (niedrige Höhe): Bühne + Rand nebeneinander, Leiste einzeilig
   9. Bewegung reduzieren, Druck */

/* ===== 1. Maße ===== */
:root{
 --sq:29px;
 --gutter:12px;
 /* Höhe, die unten frei bleiben muss (ohne sicheren Rand). Wird je nach Zustand umgeschaltet. */
 --dock:100px;
 --sheet-shadow:0 -10px 32px rgb(20 27 45 / .16);
 --scrim:rgb(20 27 45 / .45);
}
:root:has(.answer-form .feedback.is-correct){--dock:168px}
:root:has(.answer-form .feedback.is-wrong){--dock:244px}
html{
 scroll-padding-top:var(--space-3);
 /* Fokus per Tab und scrollIntoView landen nie unter der Leiste */
 scroll-padding-bottom:calc(var(--dock) + env(safe-area-inset-bottom) + var(--space-3));
}
/* Fokusring kräftiger als auf dem Desktop: Akzent hat > 3:1 gegen Weiß und Hintergrund */
:focus-visible{outline-color:var(--accent)}
.brand,.op,.btn,.icon-btn,.settings-toggle{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

.app{
 padding:var(--space-3) max(var(--gutter),env(safe-area-inset-right)) calc(var(--dock) + env(safe-area-inset-bottom) + var(--space-5)) max(var(--gutter),env(safe-area-inset-left));
}

/* ===== 2. Obere Leiste ===== */
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.brand{grid-area:1/1;min-width:0;min-height:44px;margin-right:0}
.brand-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings{grid-area:1/2;position:static;min-width:0}
.ops{grid-area:2/1/3/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:var(--r-m)}
.op{flex-direction:column;justify-content:center;gap:3px;min-width:0;min-height:58px;padding:6px 2px;border-radius:10px;font-size:12px;line-height:1.15;text-align:center}
.op-symbol{width:26px;height:26px;font-size:17px}
.op-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Sehr schmal: kindgerechte Kurznamen. Der volle Name bleibt für Screenreader
   erhalten (font-size:0), der Kurzname hat leeren Alternativtext. */
@media (max-width:479.98px),(orientation:landscape) and (max-height:500px) and (max-width:699.98px){
 .op-name{font-size:0}
 .op-name::after{font-size:13px}
 .op[data-op="add"] .op-name::after{content:"Plus";content:"Plus" / ""}
 .op[data-op="sub"] .op-name::after{content:"Minus";content:"Minus" / ""}
 .op[data-op="mul"] .op-name::after{content:"Mal";content:"Mal" / ""}
 .op[data-op="div"] .op-name::after{content:"Geteilt";content:"Geteilt" / ""}
}

.settings-toggle{min-width:44px;max-width:100%;padding:0 14px;font-size:13px}
.settings-summary{display:block;max-width:calc(100vw - 284px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:359.98px){
 .settings-summary{display:none}
 .settings-toggle{width:44px;padding:0;justify-content:center}
}

/* ===== 3. Einstellungen als Bottom-Sheet ===== */
/* Abgedunkelter Hintergrund: gehört zum <summary>, ein Tipp darauf schließt das Sheet. */
.settings[open]>.settings-toggle::before{content:"";position:fixed;inset:0;z-index:50;background:var(--scrim);cursor:default;animation:rw-fade var(--t) var(--ease)}
.settings-panel{
 position:fixed;inset:auto 0 0 0;z-index:51;
 width:auto;max-width:560px;margin-inline:auto;
 max-height:min(86dvh,620px);overflow-y:auto;overscroll-behavior:contain;
 gap:var(--space-4);
 padding:var(--space-2) max(var(--space-5),env(safe-area-inset-right)) calc(var(--space-5) + env(safe-area-inset-bottom)) max(var(--space-5),env(safe-area-inset-left));
 border:0;border-radius:var(--r-l) var(--r-l) 0 0;
 box-shadow:var(--sheet-shadow);
 animation:rw-sheet var(--t) var(--ease);
}
/* Griffleiste */
.settings-panel::before{content:"";justify-self:center;width:40px;height:4px;margin-top:2px;border-radius:2px;background:var(--line-strong)}
.settings-head{margin:-8px -10px -4px 0}
.settings-head h2{font-size:17px}
:root:has(.settings[open]){overflow:hidden}
@keyframes rw-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes rw-fade{from{opacity:0}to{opacity:1}}

/* ===== 4. Bühne ===== */
.workspace{gap:var(--space-5)}
.stage{padding:var(--space-4) var(--space-4) var(--space-5) var(--space-5)}
.stage-head{margin-bottom:var(--space-3)}
.stage-title{min-width:0;line-height:1.35;letter-spacing:.08em}
#regenerate{flex:none;padding:0 14px;font-size:14px}
/* Sehr schmal: nur das Symbol, der Name „Neue Aufgabe“ bleibt als zugänglicher Name erhalten */
@media (max-width:359.98px){
 #regenerate{width:44px;padding:0;gap:0;font-size:0}
 #regenerate .icon{width:20px;height:20px}
}
.expression{margin:0;font-size:clamp(32px,9.2vw,56px);line-height:1.12}
/* Drei und mehr Zahlen: etwas kleiner, damit die Aufgabe nicht zu lang wird */
.expression:has(.num~.num~.num){font-size:clamp(30px,8.6vw,46px)}

/* ===== 5. Antwortleiste unten ===== */
/* --keyboard-inset kann per visualViewport gesetzt werden (Wunsch an index.html), damit die
   Leiste auf iOS über der Bildschirmtastatur sitzt. Ohne den Wert gilt 0. */
.answer-form{
 position:fixed;left:0;right:0;bottom:var(--keyboard-inset,0px);z-index:20;
 display:flex;flex-direction:column;gap:var(--space-2);
 padding:var(--space-2) max(var(--gutter),env(safe-area-inset-right),calc((100% - 600px) / 2)) max(var(--space-3),env(safe-area-inset-bottom)) max(var(--gutter),env(safe-area-inset-left),calc((100% - 600px) / 2));
 background:var(--surface);
 border-top:1px solid var(--line);
 box-shadow:0 -6px 24px rgb(20 27 45 / .07);
}
.answer-fields{flex-wrap:nowrap;gap:var(--space-2)}
.field-answer{flex:1 1 auto;min-width:0;max-width:none;gap:2px}
.field-rest{flex:0 0 92px;gap:2px}
.answer-form .field-label{font-size:12px}
.answer{min-height:54px;padding:0 12px;font-size:24px}
.btn-check{flex:none;min-height:54px;padding:0 22px}
/* Rückmeldung direkt über dem Eingabefeld */
.feedback{order:-1;max-width:none;margin:0;padding:var(--space-2) var(--space-3);gap:var(--space-2) var(--space-3);font-size:14px;line-height:1.4}
.feedback>.icon{width:20px;height:20px}
.feedback-text{flex:1 1 12em}
.feedback.is-correct .feedback-text{flex-basis:6.5em}
.feedback .btn{margin-left:auto;padding:0 14px;font-size:14px}

/* ===== 6. Lösungsraster ===== */
.solution{margin-top:var(--space-5);padding-top:var(--space-4)}
.solution-head{margin-bottom:var(--space-3)}
.papers{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:var(--space-4)}
.paper-shell{overscroll-behavior-x:contain;padding-bottom:6px}
.cell{font-size:17px}
.cell.operator{font-size:21px}
.cell.carry{font-size:13px}
.cell.head{font-size:12px}
.cell.word{padding-left:2px;font-size:14px}
/* Division: Die Kontrolle steht unter der Rechnung. Ihr Inhalt ist rechtsbündig, darum
   beginnt ihr Kasten rechts (rtl-Scrollen), und überzählige Leerzeilen entfallen
   (sie dienen auf dem Desktop nur der gleichen Höhe nebeneinander). */
.paper[data-g="1"] .paper-shell{direction:rtl}
.paper[data-g="1"] .paper-grid{direction:ltr}
.paper[data-g="1"] .math-row:not(:has(.cell:not(:empty))) ~ .math-row:not(:has(.cell:not(:empty))){display:none}
/* Zurückgenommene Ziffern im Schrittmodus: noch ≥ 4.5:1 auf Weiß */
.solution.stepping .cell:not(.focus):not(.now):not(.pending){color:var(--ink-3)}

/* ===== 7. Randspalte ===== */
.margin{gap:var(--space-3);padding-left:var(--space-3);border-left:2px solid var(--margin-line)}
.note-steps{order:-1}
.note{padding:var(--space-3) var(--space-4) var(--space-4)}
.note-title-row{margin:-4px -8px var(--space-2) 0}
.note-actions{margin-top:var(--space-3)}

/* Schrittmodus im Hochformat: Schritt-Karte als Sheet unten, Raster darüber */
@media not all and (orientation:landscape) and (max-height:500px){

 :root:has(.note-steps .stepper) .answer-form{position:static;z-index:auto;margin-top:var(--space-4);padding:0;background:none;border:0;box-shadow:none}
 :root:has(.note-steps .stepper) .feedback{order:0}

  max-width:640px;margin-inline:auto;
  display:grid;grid-template-columns:minmax(0,1fr);align-items:center;column-gap:var(--space-3);
  max-height:min(50dvh,360px);overflow-y:auto;overscroll-behavior:contain;
  padding:var(--space-3) max(var(--space-4),env(safe-area-inset-right)) max(var(--space-2),env(safe-area-inset-bottom)) max(30px,calc(env(safe-area-inset-left) + 18px));
  border:0;border-radius:var(--r-l) var(--r-l) 0 0;

  background:linear-gradient(var(--margin-line),var(--margin-line)) 15px 0/2px 100% no-repeat,var(--surface);
  box-shadow:var(--sheet-shadow);

 .note-steps:has(.stepper)>.note-title-row{margin:-4px -8px 0 0}
 .note-steps:has(.stepper) .step-text{min-height:4.65em;font-size:15px}
 .note-steps:has(.stepper)>.stepper{margin-top:var(--space-2)}
 .note-steps:has(.stepper)>.note-actions{justify-content:center;margin-top:0}
 .note-steps:has(.stepper)>.note-fine{display:none}
 @media (min-width:430px){
  .note-steps:has(.stepper){grid-template-columns:minmax(0,1fr) auto}
  .note-steps:has(.stepper)>.note-title-row,.note-steps:has(.stepper)>.progress,.note-steps:has(.stepper)>.step-text{grid-column:1/-1}
  .note-steps:has(.stepper)>.note-actions{margin-top:var(--space-2)}
  :root:has(.note-steps .stepper){--dock:228px}
 }
}

/* ===== Mittlere Breiten (Hochformat 700–759 px): Rechenarten wieder mit Symbol daneben ===== */
@media (min-width:700px){
 .op{flex-direction:row;gap:8px;min-height:48px;padding:0 12px 0 6px;border-radius:999px;font-size:14px}
 .ops{border-radius:999px}
 .op-symbol{width:28px;height:28px;font-size:18px}
}

/* ===== 8. Querformat mit wenig Höhe ===== */
@media (orientation:landscape) and (max-height:500px){
 :root{--dock:66px;--sq:28px}
 :root:has(.answer-form .feedback.is-correct){--dock:122px}
 :root:has(.answer-form .feedback.is-wrong){--dock:150px}
 .app{padding-top:var(--space-2)}
 .topbar{display:flex;flex-wrap:nowrap;gap:var(--space-2);margin-bottom:var(--space-3)}
 .brand{flex:none}
 .brand-name{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
 .ops{display:flex;flex:1 1 auto;min-width:0;border-radius:999px}
 .op{flex:1 1 0;flex-direction:row;gap:6px;min-height:44px;padding:0 10px 0 6px;border-radius:999px;font-size:13px}
 .settings{flex:none;margin-left:auto}
 .settings-summary{display:none}
 .settings-toggle{width:44px;padding:0;justify-content:center}

 .workspace{grid-template-columns:minmax(0,1fr) minmax(220px,36%);align-items:start;gap:var(--space-4)}
 .stage{padding:var(--space-3) var(--space-4) var(--space-4) var(--space-5)}
 .stage-head{margin-bottom:var(--space-2)}
 .expression,.expression:has(.num~.num~.num){font-size:clamp(28px,10vh,42px)}
 .margin{position:sticky;top:var(--space-2);max-height:calc(100dvh - var(--dock) - env(safe-area-inset-bottom) - var(--space-4));overflow-y:auto;overscroll-behavior:contain}

 .answer-form{padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
 .answer-form .field-label{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
 .answer,.btn-check{min-height:48px}
 .answer{font-size:22px}
 .field-rest{flex-basis:84px}

 /* Schrittmodus: Die Schritt-Karte steht rechts neben dem Raster. Der Fehlerhinweis ist dann
    erledigt (die Karte erklärt genau diese Stelle) und gibt die knappe Höhe frei. */
 :root:has(.note-steps .stepper){--dock:66px}
 :root:has(.note-steps .stepper) .answer-form .feedback{display:none}
 .note-steps:has(.stepper)>.note-fine{display:none}
 .note-steps .step-text{font-size:15px}
 .note-steps:has(.stepper)>.note-actions{margin-top:var(--space-1)}

 .settings-panel{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--space-4);row-gap:var(--space-3);max-width:620px;max-height:calc(100dvh - var(--space-3))}
 .settings-panel::before,.settings-head{grid-column:1/-1}
}

/* ===== 9. Bewegung und Druck ===== */
@media (prefers-reduced-motion:reduce){
 .settings-panel,.settings[open]>.settings-toggle::before{animation:none}
}
}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),names={add:'Addition',sub:'Subtraktion',mul:'Multiplikation',div:'Division'},symbols={add:'+',sub:'−',mul:'·',div:':'},hashes={addition:'add',subtraktion:'sub',multiplikation:'mul',division:'div'};
const places=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender','Millionen'];
const fmt=n=>String(Number(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' '),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const state={op:'add',max:100000,difficulty:'medium',terms:2,allowRest:false,tasks:[]};
const dig=(n,p)=>Math.floor(n/10**p)%10;
function addDetail(numbers){
 let n=Math.max(...numbers.map(x=>String(x).length)),carry=0,steps=[],carryAt=[],carries=0;
 for(let p=0;p<n;p++){
  const digits=numbers.map(x=>dig(x,p)),sum=digits.reduce((a,b)=>a+b,carry),next=Math.floor(sum/10);
  carryAt[p]=carry;if(next)carries++;
  steps.push(`${places[p]||'Stelle'}: ${digits.join(' + ')}${carry?' + '+carry+' (Übertrag)':''} = ${sum}. ${sum%10} schreiben${next?', '+next+' übertragen':''}.`);
  carry=next;
 }
 return {n,carries,carryAt,outerCarry:carry,steps};
}
function subDetail(a,b){
 // Subtrahieren durch Ergänzen: die untere Zahl wird stellenweise bis zur oberen aufgefüllt.
 const n=Math.max(String(a).length,String(b).length);let carry=0,steps=[],carryAt=[],borrows=0;
 for(let p=0;p<n;p++){
  const x=dig(a,p),y=dig(b,p),s=y+carry,next=x<s?1:0,r=x+10*next-s;
  carryAt[p]=carry;if(next)borrows++;
  steps.push(`${places[p]||'Stelle'}: ${carry?`${y} + ${carry} (Übertrag) = ${s}. `:''}${next?`${x} ist kleiner als ${s}, also mit ${x+10} rechnen: `:''}${s} + ${r} = ${x+10*next}. ${p>=String(a-b).length?`Eine 0 ganz vorne schreibt man nicht${next?', aber 1 übertragen':''}.`:`${r} schreiben${next?', 1 übertragen':''}.`}`);
  carry=next;
 }
 if(carry)throw Error('Ungültige Subtraktion');
 return {n,borrows,carryAt,steps};
}
function multDetail(a,b){
 const bd=String(b).split('').map(Number),L=bd.length,parts=[],steps=[];
 bd.forEach((d,i)=>{const shift=L-1-i,value=a*d;parts.push({d,shift,value,str:String(value)});steps.push(`${fmt(a)} · ${d} = ${fmt(value)}. Die letzte Ziffer steht in der ${places[shift]||'passenden '}spalte.`)});
 const total=a*b,len=String(total).length,carryAt=[];let carry=0;
 for(let p=0;p<len;p++){carryAt[p]=carry;let sum=carry;parts.forEach(q=>{const k=p-q.shift;if(k>=0&&k<q.str.length)sum+=Number(q.str[q.str.length-1-k])});carry=Math.floor(sum/10)}
 if(L>1)steps.push(`Die Zeilen Spalte für Spalte addieren, Überträge klein unter die letzte Zeile: ${fmt(total)}.`);
 return {parts,steps,carryAt,carries:carryAt.some(Boolean)};
}
function divDetail(a,b){const chars=String(a).split('').map(Number);let remainder=0,started=false,q='',rows=[],steps=[];
 for(let i=0;i<chars.length;i++){let previous=remainder,part=previous*10+chars[i];if(!started&&part<b){remainder=part;continue}started=true;let digit=Math.floor(part/b),subtract=digit*b;remainder=part-subtract;q+=digit;rows.push({i,part,subtract,remainder,digit,previous});steps.push(`${part} : ${b} = ${digit}, denn ${digit} · ${b} = ${subtract}. Rest: ${remainder}.`)}

}
function randomPartition(total,k,min=10){const result=[];for(let i=0;i<k-1;i++){const max=total-min*(k-i-1);const x=rnd(min,max);result.push(x);total-=x;}result.push(total);return result.sort(()=>Math.random()-.5);}
function easyAddition(k,max){
 for(let trial=0;trial<600;trial++){
  const target=rnd(Math.max(100,Math.floor(max*.32)),Math.floor(max*.95)),numbers=Array(k).fill(0);
  String(target).split('').reverse().forEach((c,p)=>{
   let remaining=Number(c);
   for(let j=0;j<remaining;j++)numbers[rnd(0,k-1)]+=10**p;
  });
  if(numbers.every(n=>n>=10))return numbers;
 }
 // Sichere, übertragsfreie Reserve.
 return Array.from({length:k},(_,i)=>10**(i%2+1));
}
function easySubtraction(k,max){
 // Teile die Ziffern des Minuenden auf k Anteile auf.
 // Damit ist jede anschließende Subtraktion ohne Entbündeln möglich.
 for(let trial=0;trial<900;trial++){
  const a=rnd(Math.ceil(max*.55),Math.floor(max*.95)),pieces=Array(k).fill(0);
  String(a).split('').reverse().forEach((c,p)=>{
   for(let j=0;j<Number(c);j++)pieces[rnd(0,k-1)]+=10**p;
  });
  if(pieces.every(x=>x>=10))return [a,...pieces.slice(0,k-1)];
 }
 // Garantiert übertragsfreie Ausnahme für jeden angebotenen Zahlenraum.
 const place=10**Math.max(1,String(max).length-2);
 return [place*k,...Array(k-1).fill(place)];
}
function generator(type){let best;
 for(let trial=0;trial<1500;trial++){
  let a,b,result,remainder=0;
  if(type==='add'){
   const numbers=state.difficulty==='easy'?easyAddition(state.terms,state.max):randomPartition(rnd(Math.ceil(state.max*.4),state.max),state.terms);
   result=numbers.reduce((x,y)=>x+y,0);const count=addDetail(numbers).carries;best={numbers,result};
   if(state.difficulty==='easy'?count===0:state.difficulty==='medium'?count>=1:count>=2)return best;
  }else if(type==='sub'){
   let numbers;
   if(state.difficulty==='easy')numbers=easySubtraction(state.terms,state.max);
   else {a=rnd(Math.ceil(state.max*.5),state.max);const spend=rnd(Math.max(11*(state.terms-1),Math.floor(a*.35)),a-10);numbers=[a,...randomPartition(spend,state.terms-1)]}
   result=numbers.slice(1).reduce((acc,x)=>acc-x,numbers[0]);
   if(result<0||numbers.some(x=>x<10)||numbers[0]>state.max)continue;
   let balance=numbers[0],count=0;for(const n of numbers.slice(1)){count+=subDetail(balance,n).borrows;balance-=n}
   best={numbers,result};if(state.difficulty==='easy'?count===0:state.difficulty==='medium'?count>=1:count>=2)return best;
  }else if(type==='mul'){
   let digits=state.difficulty==='easy'?1:state.difficulty==='medium'?2:state.max===1000?2:3,lo=digits===1?2:10**(digits-1),hi=digits===1?9:10**digits-1;hi=Math.min(hi,Math.floor(state.max/10));if(hi<lo)continue;
   b=rnd(lo,hi);let amax=Math.floor(state.max/b);if(amax<10)continue;a=rnd(Math.max(10,Math.floor(amax*.15)),amax);if(a<b&&Math.random()<.6)[a,b]=[b,a];result=a*b;best={a,b,result};if(result<=state.max)return best;
  }else{
   b=state.difficulty==='medium'?(Math.random()<.5?rnd(2,4):rnd(5,9)):rnd(2,9);let qmin=state.max===1000?12:Math.max(12,Math.floor(state.max/(b*8))),qmax=Math.floor(state.max/b);if(qmin>qmax)qmin=2;let q=rnd(qmin,qmax);if(state.difficulty==='easy'&&/0/.test(String(q)))continue;if(state.difficulty==='hard'&&q>=100&&Math.random()<.5&&!/0/.test(String(q)))continue;
   const maxRest=Math.min(b-1,state.max-b*q);if(state.allowRest&&maxRest<1)continue;remainder=state.allowRest?rnd(1,maxRest):0;a=q*b+remainder;result=q;best={a,b,result,remainder};if(a<=state.max)return best;
  }
 }
 return best||({add:{numbers:[423,312],result:735},sub:{numbers:[900,210],result:690},mul:{a:123,b:4,result:492},div:{a:936,b:4,result:234,remainder:0}}[type]);
}
/* ===== Kästchenraster ===== */
function blank(cols){return Array.from({length:cols},()=>({text:''}))}
function put(row,at,text,klass='',span=1){const s=String(text);if(span>1){if(at>=0&&at<row.length){row[at]={text:s,klass,span};for(let k=1;k<span&&at+k<row.length;k++)row[at+k]={skip:true}}return}for(let j=0;j<s.length;j++){const col=at+j;if(col>=0&&col<row.length)row[col]={text:s[j],klass}}}
function putRight(row,text,ending,klass=''){put(row,ending-String(text).length+1,String(text),klass)}
function line(row,first,last,kind='line'){for(let i=Math.max(0,first);i<=Math.min(row.length-1,last);i++)row[i]={...row[i],[kind]:true}}
// Schrittmarke: Zelle erscheint erst ab Schritt s (Schritt-für-Schritt-Ansicht).
function stamp(row,s){row.forEach(c=>{if(c.text)c.s=s})}
const shortPlaces=['E','Z','H','T','ZT','HT','M'];
function headerRow(cols,digits){const row=blank(cols);for(let p=0;p<digits;p++)row[cols-1-p]={text:shortPlaces[p]||'',klass:'head'};line(row,cols-digits,cols-1);return row}
function resultRow(cols,value,klass='result'){const row=blank(cols),s=String(value);putRight(row,s,cols-1,klass);line(row,cols-s.length,cols-1,'double');return row}
function gridHtml(grid,g){
 const cell=(c,r,i)=>c.skip?'':`<div class="cell ${esc(c.klass||'')}${c.line?' underline':''}${c.double?' double':''}" data-r="${r}" data-c="${i}"${c.s!=null?` data-s="${c.s}"`:''}${c.span>1?` style="grid-column:span ${c.span};width:calc(var(--sq) * ${c.span})"`:''}>${esc(c.text||'')}</div>`;
 return `<figure class="paper" data-g="${g}">${grid.label?`<figcaption class="paper-label">${esc(grid.label)}</figcaption>`:''}<div class="paper-shell"><div class="paper-grid" style="--columns:${grid.cols};--rows:${grid.rows.length}" role="img" aria-label="${esc(grid.aria||'Schriftliche Rechnung')}">${grid.rows.map((row,r)=>`<div class="math-row">${row.map((c,i)=>cell(c,r,i)).join('')}</div>`).join('')}${grid.overlay||''}</div></div></figure>`;
}
// Jede Layout-Funktion liefert {grids:[{rows,cols,overlay,label,aria}], steps:[{text,g,cols,rows,cells}]}.
function additionLayout(t){
 const nums=t.numbers,d=addDetail(nums),len=String(t.result).length,width=Math.max(len,...nums.map(x=>String(x).length)),cols=width+1,rows=[headerRow(cols,width)];
 nums.forEach((n,i)=>{const row=blank(cols);if(i>0)put(row,0,'+','operator');putRight(row,n,cols-1);if(i===nums.length-1)line(row,0,cols-1);rows.push(row)});

 put(krows[0],0,'Kontrolle:','word',4);put(krows[0],ks,sq);put(krows[0],ks+sq.length,'·','operator');put(krows[0],ks+sq.length+1,sb);line(krows[0],ks,kc-1);

const nf=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const roundSig=(n,sig)=>{const e=10**Math.max(0,String(n).length-sig);return Math.round(n/e)*e};
function tipList(t){
 const first='Erster Schritt: '+getLayout(t).steps[0].text;
 if(state.op==='add'){const r=t.numbers.map(n=>roundSig(n,2));return ['Schreib die Zahlen stellengerecht untereinander: Einer unter Einer, Zehner unter Zehner. Fang rechts bei den Einern an.',`Überschlag: ${r.map(fmt).join(' + ')} = ${fmt(r.reduce((a,b)=>a+b,0))}. Dein Ergebnis sollte in der Nähe liegen.`,first]}
 if(state.op==='sub'){const r=t.numbers.map(n=>roundSig(n,2));return ['Schreib die größere Zahl oben, Einer unter Einer. Rechne von rechts: Wie viel fehlt von der unteren bis zur oberen Ziffer? Reicht es nicht, rechnest du mit 10 mehr und überträgst 1.',`Überschlag: ${r.map(fmt).join(' − ')} = ${fmt(r.slice(1).reduce((a,b)=>a-b,r[0]))}. Dein Ergebnis sollte in der Nähe liegen.`,first]}
 if(state.op==='mul'){const a=roundSig(t.a,1),b=roundSig(t.b,1);return ['Multipliziere die erste Zahl nacheinander mit jeder Ziffer der zweiten Zahl. Jede neue Zeile rückt eine Stelle weiter nach rechts. Zum Schluss addierst du alle Zeilen.',`Überschlag: ${fmt(a)} · ${fmt(b)} = ${fmt(a*b)}. Dein Ergebnis sollte in der Nähe liegen.`,first]}
 const d=divDetail(t.a,t.b);
 return [`Rechne von links: Wie oft passt ${t.b} in die erste Ziffer oder in die ersten beiden? Dann multiplizieren, abziehen und die nächste Ziffer herunterholen.`,`Dein Ergebnis hat ${String(d.quotient).length} Stellen, denn ${t.b} passt zum ersten Mal in ${d.rows[0].part}.`,first];

function wrongDetail(t){

 const a=String(v),b=String(t.result),steps=getLayout(t).steps;
 if(state.op==='div'){
  if(v===t.result)return {text:`Das Ergebnis stimmt. Prüfe den Rest: Er muss kleiner als ${t.b} sein.`,step:steps.length-2};
  if(a.length!==b.length)return {text:`Dein Ergebnis hat ${a.length} Stellen, richtig sind ${b.length}. In welche ersten Ziffern passt ${t.b} zum ersten Mal?`,step:0};
  let k=0;while(k<a.length&&a[k]===b[k])k++;
  return {text:`${k===0?'':k===1?'Die erste Ziffer stimmt. ':`Die ersten ${k} Ziffern stimmen. `}Prüfe die ${k+1}. Ziffer.`,step:k};
 }
 if(a.length!==b.length)return {text:`Dein Ergebnis hat ${a.length} Stellen, richtig sind ${b.length}.${state.op==='add'?' Hast du den letzten Übertrag aufgeschrieben?':''}`};
 let p=0;while(p<a.length&&a[a.length-1-p]===b[b.length-1-p])p++;
 const ok=p===0?'':p===1?'Die Einer stimmen schon. ':p===2?'Einer und Zehner stimmen schon. ':`Die letzten ${p} Stellen stimmen schon. `;
 const columnwise=state.op==='add'||(state.op==='sub'&&t.numbers.length===2);

<form class="answer-form" novalidate><div class="answer-fields"><label class="field field-answer"><span class="field-label">Dein Ergebnis</span><input class="answer" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" data-field="answer" value="${esc(t.answer)}" placeholder="?"${wrong?' aria-invalid="true"':''}></label>${div&&state.allowRest?`<label class="field field-rest"><span class="field-label">Rest</span><input class="answer" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" data-field="restAnswer" value="${esc(t.restAnswer)}" placeholder="0"></label>`:''}<button class="btn btn-primary btn-check" type="submit" data-action="check">Prüfen</button></div>${feedbackHtml(t)}</form>
${t.show?solutionHtml(t):''}`;

function solutionHtml(t){const L=getLayout(t);return `<section class="solution" id="solution" aria-labelledby="solution-title"><div class="solution-head"><h2 id="solution-title">Lösung</h2><p class="solution-value">${fmt(t.result)}${state.op==='div'&&t.remainder?' Rest '+t.remainder:''}</p></div><div class="papers">${L.grids.map(gridHtml).join('')}</div></section>`}

  const steps=getLayout(t).steps,n=steps.length,k=t.step;

function applyStep(){
 const t=state.tasks[0],box=document.getElementById('solution');if(!box)return;
 const k=t.step,step=k==null?null:getLayout(t).steps[k];
 box.classList.toggle('stepping',k!=null);
 box.querySelectorAll('[data-s]').forEach(el=>{const s=+el.dataset.s;el.classList.toggle('pending',k!=null&&s>k);el.classList.toggle('now',k!=null&&s===k)});
 box.querySelectorAll('.focus').forEach(el=>el.classList.remove('focus'));
 if(!step)return;
 const fig=box.querySelector(`[data-g="${step.g}"]`);if(!fig)return;
 const mark=sel=>fig.querySelectorAll(sel).forEach(el=>el.classList.add('focus'));
 (step.cols||[]).forEach(c=>mark(`.cell[data-c="${c}"]`));(step.rows||[]).forEach(r=>mark(`.cell[data-r="${r}"]`));(step.cells||[]).forEach(([r,c])=>mark(`.cell[data-r="${r}"][data-c="${c}"]`));

 if(key&&!$('#settings').contains(ae)){const el=document.querySelector(key);if(el&&!el.disabled)el.focus({preventScroll:true});else{const alt=document.querySelector('#margin .stepper .btn-primary, #margin [data-action="steps"]');if(alt)alt.focus({preventScroll:true})}}

function changePage(){state.op=hashes[decodeURIComponent(location.hash.slice(1))]||'add';$('#title').textContent='Schriftliche '+names[state.op];$('#rest-area').classList.toggle('hidden',state.op!=='div');$('#terms-area').classList.toggle('hidden',!['add','sub'].includes(state.op));document.querySelectorAll('.op').forEach(el=>{if(el.dataset.op===state.op)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});generate()}

function check(){
 const t=state.tasks[0],v=parseValue(t.answer),r=String(t.restAnswer).trim()===''?0:parseValue(t.restAnswer);
 const ok=Number.isFinite(v)&&v===t.result&&(!('remainder' in t)||r===t.remainder);

// Alle markierten Kästchen zwischen oberen Rand und Scroll-Polster unten bringen (das Polster deckt Leiste bzw. Schritt-Sheet ab).
function showStepCells(behavior){
 const cells=[...document.querySelectorAll('#solution .cell.now, #solution .cell.focus')];if(!cells.length)return;
 const rs=cells.map(c=>c.getBoundingClientRect()),top=Math.min(...rs.map(r=>r.top)),bottom=Math.max(...rs.map(r=>r.bottom));
 const cs=getComputedStyle(document.documentElement),padT=parseFloat(cs.scrollPaddingTop)||0,padB=parseFloat(cs.scrollPaddingBottom)||0;
 let dy=0;if(bottom>innerHeight-padB)dy=bottom-(innerHeight-padB);if(top-dy<padT)dy=top-padT;
 if(Math.abs(dy)>1)window.scrollBy({top:dy,behavior});
}
function act(action,btn){
 const t=state.tasks[0];
 if(action==='new')return generate(true);
 if(action==='tip')t.tip++;
 else if(action==='steps'){t.show=true;t.step=0}
 else if(action==='all'){t.show=true;t.step=null}
 else if(action==='hide'){t.show=false;t.step=null}
 else if(action==='prev')t.step=Math.max(0,t.step-1);
 else if(action==='next')t.step=Math.min(getLayout(t).steps.length-1,t.step+1);
 else if(action==='goto'){t.show=true;t.step=Number(btn.dataset.step)}
 else return;
 render();
 // Die markierten Kästchen des aktuellen Schritts ins Bild holen (auf dem Handy liegt sonst das Schritt-Sheet darüber).
 const motion=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
 if(t.step!=null&&['steps','goto','prev','next'].includes(action))showStepCells(motion);
 else if(action==='all')revealSolution();
}

window.__rechenwerkstatt={addDetail,subDetail,multDetail,divDetail,additionLayout,subtractionLayout,multiplicationLayout,divisionLayout,getLayout,tipList,wrongDetail,generator,render,get state(){return state}};
// iOS: Höhe der Bildschirmtastatur als --keyboard-inset, damit die Antwortleiste darüber sitzt.
if(window.visualViewport){const vv=window.visualViewport,setInset=()=>document.documentElement.style.setProperty('--keyboard-inset',Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop))+'px');vv.addEventListener('resize',setInset);vv.addEventListener('scroll',setInset);setInset()}
